version: '3.8'

services:
  web:
    build: .
    ports:
      - "5000:5000"
    env_file:
      - .env
    volumes:
      - ./:/app
      - flask_session:/app/flask_session
    restart: unless-stopped
    environment:
      - API_HOST=0.0.0.0
      - API_PORT=5000
      - API_DEBUG=false

volumes:
  flask_session: 